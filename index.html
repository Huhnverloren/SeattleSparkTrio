<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seattle Spark Trio — Classical Music</title>
  <meta name="description" content="Seattle Spark Trio: live classical string music for weddings and events in the Seattle area.">
  <link rel="canonical" href="https://seattlesparktrio.com/">
  <link rel="icon" type="image/png" href="media/icon.png">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Seattle Spark Trio">
  <meta property="og:description" content="Live classical string music for weddings and events in the Seattle area.">
  <meta property="og:url" content="https://seattlesparktrio.com/">
  <meta property="og:image" content="https://seattlesparktrio.com/media/og.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #e4e6e6;      /* matches the logo video's background exactly */
      --ink: #1a1a1a;
      --muted: #555b5c;
      --neon: #ef8a8a;
      --gold: #e9c24f;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); }
    body {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.25rem;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 16px;
    }
    main { width: 100%; max-width: 640px; text-align: center; flex: 1; }
    .logo { display: block; width: 100%; max-width: 560px; height: auto; margin: 2rem auto 0; }
    h1 { position: absolute; left: -9999px; } /* the logo says it; keep a real heading for search and screen readers */
    .lede { font-size: 1.5rem; font-style: italic; margin: 0.5rem 0 1.75rem; }
    .btn {
      display: inline-block;
      padding: 0.7rem 1.6rem;
      border: 1.5px solid var(--ink);
      border-radius: 999px;
      color: var(--ink);
      text-decoration: none;
      font-size: 1.15rem;
      letter-spacing: 0.04em;
      transition: box-shadow 0.2s, border-color 0.2s;
    }
    .btn:hover, .btn:focus-visible { border-color: var(--neon); box-shadow: 0 0 14px var(--neon); outline: none; }
    .contact { margin-top: 0.9rem; color: var(--muted); font-size: 1.05rem; }
    .email { color: var(--muted); user-select: all; }
    .copy {
      font: inherit; font-size: 0.95rem; color: var(--ink);
      background: none; border: 1px solid var(--muted); border-radius: 999px;
      padding: 0.15rem 0.8rem; margin-left: 0.4rem; cursor: pointer;
    }
    .copy:hover, .copy:focus-visible { border-color: var(--neon); box-shadow: 0 0 10px var(--neon); outline: none; }
    .alt { display: block; margin-top: 0.4rem; font-size: 0.95rem; }
    .alt a { color: var(--muted); }
    footer { color: var(--muted); font-size: 0.95rem; padding: 3rem 0 1.5rem; }
  </style>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "MusicGroup",
    "name": "Seattle Spark Trio",
    "url": "https://seattlesparktrio.com/",
    "logo": "https://seattlesparktrio.com/media/logo.png",
    "image": "https://seattlesparktrio.com/media/og.png",
    "email": "bookthelook@seattlesparktrio.com",
    "genre": "Classical",
    "description": "Live acoustic classical string music for weddings and events in Seattle, performed by three real humans (and a Spark of inspiration).",
    "sameAs": ["https://seasparktrio.com/"],
    "areaServed": { "@type": "City", "name": "Seattle", "containedInPlace": { "@type": "State", "name": "Washington" } },
    "makesOffer": [
      { "@type": "Offer", "name": "Up to 1 hour", "price": "450", "priceCurrency": "USD" },
      { "@type": "Offer", "name": "Up to 1.5 hours", "price": "650", "priceCurrency": "USD" },
      { "@type": "Offer", "name": "Up to 2 hours", "price": "825", "priceCurrency": "USD" },
      { "@type": "Offer", "name": "Up to 3 hours", "price": "1275", "priceCurrency": "USD" }
    ]
  }
  </script>
</head>
<body>
  <main>
    <h1>Seattle Spark Trio</h1>
    <video class="logo" id="logo" muted playsinline preload="auto"
           poster="media/logo.png" width="1080" height="1080"
           aria-label="Seattle Spark Trio logo: a violin and bow drawn in a single line, with the words Seattle Spark Trio, classical music, for weddings and events">
      <source src="media/logo.mp4" type="video/mp4">
      <img src="media/logo.png" alt="Seattle Spark Trio logo">
    </video>

    <p class="lede">Live classical string music for your event.</p>
    <a class="btn" href="mailto:bookthelook@seattlesparktrio.com?subject=Booking%20inquiry">Book the trio</a>
    <p class="contact">
      <span class="email" id="email">bookthelook@seattlesparktrio.com</span>
      <button class="copy" id="copy" type="button">Copy</button>
      <span class="alt">Button not opening your email? Copy the address above, or
        <a href="https://mail.google.com/mail/?view=cm&amp;to=bookthelook@seattlesparktrio.com&amp;su=Booking%20inquiry" target="_blank" rel="noopener">write from Gmail</a>.</span>
    </p>
  </main>
  <footer>&copy; 2026 Seattle Spark Trio · Seattle, Washington</footer>

  <script>
    // Plays the logo animation once and stops on the finished logo.
    // With reduced motion turned on, the still logo (the poster) stays up.
    (function () {
      var v = document.getElementById('logo');
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var p = v.play();
      if (p && p.catch) p.catch(function () {});
    })();

    // "Book the trio" only works if the visitor's computer has a mail app set up,
    // so the address can also be copied with one click.
    (function () {
      var btn = document.getElementById('copy');
      var addr = document.getElementById('email').textContent.trim();
      btn.addEventListener('click', function () {
        function done() { btn.textContent = 'Copied!'; setTimeout(function () { btn.textContent = 'Copy'; }, 2000); }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(addr).then(done, function () { selectAddr(); });
        } else { selectAddr(); }
      });
      function selectAddr() {
        var r = document.createRange(); r.selectNodeContents(document.getElementById('email'));
        var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
        btn.textContent = 'Press Ctrl+C';
      }
    })();
  </script>
</body>
</html>
